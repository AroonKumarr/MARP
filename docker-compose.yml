version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: marp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marp_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-marp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marp_user} -d ${POSTGRES_DB:-marp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marp_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marp_user}:${POSTGRES_PASSWORD:-marp_secure_password_2026}@db:5432/${POSTGRES_DB:-marp_db}
      SECRET_KEY: ${SECRET_KEY:-marp-super-secret-key-production-fyp-2026-secure-token}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-admin@marp.io}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-Admin12345!}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli.bootstrap --seed-demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marp_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
